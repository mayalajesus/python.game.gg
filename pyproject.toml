[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-game-bot"
version = "0.1.0"
description = "Discord bot for the python.game learning guild."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.3,<3",
  "python-dotenv>=1.0,<2",
  "audioop-lts>=0.2; python_version >= '3.13'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
